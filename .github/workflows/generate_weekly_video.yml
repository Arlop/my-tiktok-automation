name: Generate Weekly Jail Roster TikTok

on:
  schedule:
    # Runs every Sunday at 23:00 UTC (6:00 PM CST)
    - cron: '0 23 * * 0'
  
  # Allows manual triggering from the GitHub Actions UI anytime
  workflow_dispatch:

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install FFmpeg (Required by MoviePy for video rendering)
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 4. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Run the Video Generator script
      - name: Run Video Generator
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          python generate_roster_video.py

      # 6. Save the generated MP4 as a downloadable Artifact (Backup)
      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-roster-video
          path: daily_output/*.mp4
          retention-days: 7
